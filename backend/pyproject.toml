[project]
name = "homesync-server"
version = "0.1.0"
description = "Linux-side catalog daemon for Homesync"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.0",
  "python-multipart>=0.0.12",
  "httpx>=0.28",
  "blake3>=1.0.9",
  "pillow>=12.3.0",
  "pykeepass>=4.1.1.post1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
homesync-server = "homesync_server.main:run"
homesync-index = "homesync_server.cli:run_index"
homesync-gc = "homesync_server.cli:run_gc"
homesync-migrate-data = "homesync_server.migrate_data:run_migrate"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homesync_server = ["db/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI Depends() in Annotated aliases is fine; LOG015 is noisy for small CLIs.
ignore = ["B008", "LOG015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
