name: homesync_mobile
description: Homesync Android catalog client (list / pin / restore).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  drift: ^2.28.1
  drift_flutter: ^0.2.6
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^8.0.3
  http: ^1.4.0
  injectable: ^2.5.0
  json_annotation: ^4.12.0
  logger: ^2.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.1
  blake3_dart: ^1.0.0
  permission_handler: ^13.0.0
  file_picker: ^11.0.3
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.1
  freezed: ^3.1.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
